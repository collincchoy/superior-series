<svg xmlns="http://www.w3.org/2000/svg" width="80" height="56" viewBox="0 0 80 56">
  <!-- Crownie: a flying crown like Rex's, with little leafy wings and a cranky face. Faces left. -->
  <!-- wings -->
  <g fill="#9be35a" stroke="#2e7d2a" stroke-width="2.5" stroke-linejoin="round">
    <path d="M18 30 Q2 22 4 8 Q12 18 22 22 Z"/>
    <path d="M62 30 Q78 22 76 8 Q68 18 58 22 Z"/>
  </g>
  <!-- crown -->
  <path d="M16 46 L18 14 L30 28 L40 8 L50 28 L62 14 L64 46 Q40 54 16 46 Z" fill="#ffd36a" stroke="#a36b00" stroke-width="3" stroke-linejoin="round"/>
  <path d="M20 40 Q40 46 60 40" fill="none" stroke="#ffeaa0" stroke-width="3" stroke-linecap="round"/>
  <g fill="#ff5fa2" stroke="#a0124e" stroke-width="1.5"><circle cx="18" cy="14" r="3.5"/><circle cx="40" cy="8" r="3.5"/><circle cx="62" cy="14" r="3.5"/></g>
  <!-- cranky face -->
  <ellipse cx="32" cy="34" rx="5" ry="5.5" fill="#fff" stroke="#5c3510" stroke-width="2"/>
  <ellipse cx="48" cy="34" rx="5" ry="5.5" fill="#fff" stroke="#5c3510" stroke-width="2"/>
  <circle cx="31" cy="35" r="2.5" fill="#1b1b1b"/><circle cx="47" cy="35" r="2.5" fill="#1b1b1b"/>
  <path d="M26 27 l10 4 M54 27 l-10 4" stroke="#5c3510" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M35 44 q5 -3 10 0" fill="none" stroke="#5c3510" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="40" cy="22" r="3" fill="#3ef0d0" stroke="#0e8f7a" stroke-width="1.5"/>
</svg>
