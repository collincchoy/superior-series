<svg xmlns="http://www.w3.org/2000/svg" width="180" height="220" viewBox="0 0 180 220">
  <!-- Rex's golden banana throne (final level). Feet at the bottom edge; Rex sits in front of it. -->
  <g stroke="#7a5200" stroke-width="5" stroke-linejoin="round">
    <!-- tall banana-shaped back -->
    <path d="M60 196 C30 150 30 70 70 26 C84 12 104 12 116 24 C150 64 152 150 122 196 Z" fill="#ffd23a"/>
    <path d="M78 40 C56 80 56 140 72 186" fill="none" stroke="#fff3a0" stroke-width="8"/>
    <!-- crown crest -->
    <path d="M62 30 L70 4 L82 20 L92 0 L102 20 L114 4 L120 30 Q92 40 62 30 Z" fill="#ffd36a" stroke="#a36b00"/>
    <g fill="#3ef0d0" stroke="none"><circle cx="82" cy="26" r="4"/><circle cx="102" cy="26" r="4"/></g>
    <!-- seat and armrests -->
    <path d="M22 140 H158 Q166 140 166 150 V176 H14 V150 Q14 140 22 140 Z" fill="#a0124e" stroke="#5c0a2c"/>
    <path d="M26 146 H154" stroke="#ff5fa2" stroke-width="5" stroke-linecap="round"/>
    <rect x="6" y="120" width="28" height="64" rx="10" fill="#ffd23a"/>
    <rect x="146" y="120" width="28" height="64" rx="10" fill="#ffd23a"/>
    <circle cx="20" cy="120" r="12" fill="#ffd36a"/>
    <circle cx="160" cy="120" r="12" fill="#ffd36a"/>
    <!-- legs -->
    <path d="M24 176 L18 216 H40 L44 176 Z M136 176 L140 216 H162 L156 176 Z" fill="#c49a00"/>
  </g>
  <g fill="#ff5fa2"><circle cx="20" cy="120" r="5"/><circle cx="160" cy="120" r="5"/></g>
</svg>
