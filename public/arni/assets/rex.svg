<svg xmlns="http://www.w3.org/2000/svg" width="128" height="160" viewBox="0 0 128 160">
  <!-- Rex the Banana: big, smug, crowned villain. Feet at the bottom edge. Faces left. -->
  <g stroke="#7a5200" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- cape -->
    <path d="M86 52 Q120 70 118 150 L86 140 Z" fill="#a0124e" stroke="#5c0a2c"/>
    <!-- feet -->
    <ellipse cx="46" cy="153" rx="16" ry="7" fill="#6b4320" stroke="#3d2814"/>
    <ellipse cx="80" cy="153" rx="16" ry="7" fill="#6b4320" stroke="#3d2814"/>
    <!-- body: a big curved banana -->
    <path d="M70 26 C26 44 18 104 40 138 C52 154 82 154 100 140 C74 124 66 82 80 30 Z" fill="#ffe14d"/>
    <path d="M70 34 C40 54 36 100 52 130" fill="none" stroke="#fff3a0" stroke-width="6"/>
    <g fill="#c49a00" stroke="none"><circle cx="44" cy="70" r="3"/><circle cx="40" cy="104" r="3.5"/><circle cx="60" cy="128" r="2.5"/></g>
    <!-- stem -->
    <path d="M70 26 Q72 14 82 10 L86 18 Q78 20 78 30 Z" fill="#6b4423" stroke="#3d2814"/>
    <!-- crown -->
    <path d="M52 22 L56 4 L64 16 L72 0 L78 16 L88 4 L88 24 Q70 30 52 22 Z" fill="#ffd36a" stroke="#a36b00"/>
    <g fill="#3ef0d0" stroke="none"><circle cx="64" cy="20" r="3"/><circle cx="78" cy="20" r="3"/></g>
    <!-- arm with a peel, raised -->
    <path d="M36 84 Q14 76 12 60" fill="none" stroke="#c49a00" stroke-width="6"/>
  </g>
  <!-- smug face -->
  <path d="M38 58 l14 4 M58 62 l14 -2" stroke="#4d3600" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="46" cy="68" rx="6" ry="6.5" fill="#fff" stroke="#4d3600" stroke-width="2.5"/>
  <ellipse cx="64" cy="68" rx="6" ry="6.5" fill="#fff" stroke="#4d3600" stroke-width="2.5"/>
  <circle cx="44" cy="69" r="3" fill="#1b1b1b"/><circle cx="62" cy="69" r="3" fill="#1b1b1b"/>
  <path d="M42 86 Q54 96 68 84" fill="#7a2a1a" stroke="#4d3600" stroke-width="3" stroke-linejoin="round"/>
  <path d="M46 87 h4 v4 h-4 Z M56 88 h4 v4 h-4 Z" fill="#fff"/>
  <!-- mustache -->
  <path d="M38 80 Q46 74 54 80 Q62 74 70 80 Q62 84 54 82 Q46 84 38 80 Z" fill="#6b4423"/>
</svg>
