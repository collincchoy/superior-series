<svg xmlns="http://www.w3.org/2000/svg" width="72" height="80" viewBox="0 0 72 80">
  <!-- Bruiser: big bruised banana, slow and tough -->
  <g stroke="#9a6d00" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="24" cy="75" rx="10" ry="4.5" fill="#6b4a2b" stroke="#3d2814"/>
    <ellipse cx="48" cy="75" rx="10" ry="4.5" fill="#6b4a2b" stroke="#3d2814"/>
    <rect x="31" y="2" width="11" height="10" rx="3" fill="#6b4a2b"/>
    <path d="M34 11 C6 24 4 60 24 71 C36 77 52 76 62 66 C46 60 40 36 42 12 Z" fill="#f2cf45"/>
  </g>
  <!-- bruises -->
  <g fill="#8a5aa6" opacity="0.75">
    <ellipse cx="18" cy="52" rx="6" ry="4"/><ellipse cx="44" cy="62" rx="5" ry="3.5"/><ellipse cx="30" cy="20" rx="4" ry="3"/>
  </g>
  <!-- bandage -->
  <g transform="rotate(-20 40 24)">
    <rect x="30" y="20" width="22" height="9" rx="3" fill="#ffd9c2" stroke="#c48a6a" stroke-width="2"/>
    <path d="M38 22 v5 M44 22 v5" stroke="#c48a6a" stroke-width="1.5"/>
  </g>
  <!-- angry eyes -->
  <ellipse cx="24" cy="40" rx="5" ry="5" fill="#fff" stroke="#4d3600" stroke-width="2"/>
  <ellipse cx="37" cy="40" rx="5" ry="5" fill="#fff" stroke="#4d3600" stroke-width="2"/>
  <circle cx="25" cy="41" r="2.6" fill="#1b1b1b"/><circle cx="38" cy="41" r="2.6" fill="#1b1b1b"/>
  <path d="M17 32 l11 5 M44 32 l-10 5" stroke="#4d3600" stroke-width="3" stroke-linecap="round"/>
  <!-- grumpy frown -->
  <path d="M23 55 q8 -6 16 0" fill="none" stroke="#4d3600" stroke-width="3" stroke-linecap="round"/>
</svg>
